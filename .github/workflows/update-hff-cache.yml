name: Update HFF cache

on:
  schedule:
    # 01:00 KST
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    env:
      HFF_PROXY_URL: https://hff-tracker.vercel.app/api/proxy
      HFF_API_KEY: ${{ secrets.HFF_API_KEY }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      HFF_CACHE_PAGE_SIZE: 500
      HFF_CACHE_CONCURRENCY: 2
      HFF_CACHE_SLEEP_MS: 500

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update static cache
        run: node scripts/update-hff-cache.mjs

      - name: Commit cache
        run: |
          if [ -z "$(git status --short public/hff-cache*.json)" ]; then
            echo "No cache changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hff-cache*.json
          git commit -m "chore: update HFF cache"
          git push
